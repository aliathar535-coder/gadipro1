name: Build PWA APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Initialize Android Manifest
        run: |
          bubblewrap init --manifest https://aliathar535-coder.github.io/gadipro1/manifest.json --directory ./android-app --skip_jdk_check

      - name: Build APK
        run: |
          cd android-app
          bubblewrap build
          
